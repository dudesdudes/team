<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Dudes Team DM Check</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg1:#0a0a12;--bg2:#14141f;--glass:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.06);--purple:#6C63FF;--cyan:#00D4FF;--green:#00C853;--red:#FF1744;--text:#fff;--text2:rgba(255,255,255,0.55);--text3:rgba(255,255,255,0.3)}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(145deg,var(--bg1),var(--bg2));display:flex;justify-content:center;padding:0}
    .wrap{width:100%;max-width:480px;min-height:100vh;padding:20px}
    .hidden{display:none!important}

    .section{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;animation:fadeUp 0.4s ease-out}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .greet{font-size:18px;font-weight:700;color:var(--text)}
    .greet span{color:var(--purple)}
    .logout{font-size:12px;font-weight:600;color:var(--text3);background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;font-family:'Inter',sans-serif;transition:0.2s}
    .logout:hover{color:var(--red);border-color:rgba(255,23,68,0.2)}

    .label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}

    .input-row{display:flex;gap:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;padding:5px}
    .input-row input{flex:1;background:transparent;border:none;padding:12px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;font-weight:500;outline:none}
    .input-row input::placeholder{color:rgba(255,255,255,0.2)}
    .input-row .go{padding:10px 24px;background:linear-gradient(135deg,var(--purple),#4A43C9);border:none;border-radius:10px;color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap}
    .input-row .go:hover{box-shadow:0 4px 20px rgba(108,99,255,0.3);transform:scale(1.02)}
    .input-row .go:active{transform:scale(0.97)}
    .input-row .go:disabled{opacity:0.3;cursor:not-allowed;transform:none!important}

    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:r 0.6s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes r{to{transform:rotate(360deg)}}

    .err{font-size:13px;color:var(--red);text-align:center;min-height:18px;margin-top:8px}

    .status{border-radius:14px;padding:24px;animation:fadeUp 0.35s ease;text-align:center}
    .status-ok{background:linear-gradient(135deg,rgba(0,200,83,0.1),rgba(0,200,83,0.03));border:1px solid rgba(0,200,83,0.12);border-left:4px solid var(--green)}
    .status-no{background:linear-gradient(135deg,rgba(255,23,68,0.08),rgba(255,23,68,0.02));border:1px solid rgba(255,23,68,0.1);border-left:4px solid var(--red)}
    .status-sv{background:linear-gradient(135deg,rgba(108,99,255,0.1),rgba(108,99,255,0.03));border:1px solid rgba(108,99,255,0.12);border-left:4px solid var(--purple)}

    .s-icon{font-size:40px;margin-bottom:10px}
    .s-title{font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text)}
    .status-ok .s-title{color:#69F0AE}
    .status-no .s-title{color:#FF5252}
    .status-sv .s-title{color:#B388FF}
    .s-sub{font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.5}

    .s-info{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px 16px;margin-bottom:16px;text-align:left}
    .s-info-row{font-size:14px;color:var(--text2);line-height:1.6}
    .s-info-row strong{color:var(--text);font-weight:600}

    .btns{display:flex;gap:10px;justify-content:center}
    .btns .b{padding:12px 24px;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;text-decoration:none;text-align:center}
    .b:active{transform:scale(0.96)}
    .b-g{background:linear-gradient(135deg,var(--green),#00E676);color:#fff}
    .b-g:hover{box-shadow:0 4px 20px rgba(0,200,83,0.25);transform:translateY(-1px)}
    .b-p{background:linear-gradient(135deg,var(--purple),#4A43C9);color:#fff}
    .b-p:hover{box-shadow:0 4px 20px rgba(108,99,255,0.25);transform:translateY(-1px)}
    .b-o{background:rgba(255,255,255,0.06);color:var(--text2);border:1px solid var(--border)}
    .b-o:hover{color:var(--text);background:rgba(255,255,255,0.1)}
    .b:disabled{opacity:0.3;cursor:not-allowed;transform:none!important}

    .hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .hist-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px}
    .hist-clear{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;padding:4px 10px;border-radius:6px;transition:0.2s}
    .hist-clear:hover{color:var(--red);background:rgba(255,23,68,0.08)}
    .hist-list{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .hist-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.03);transition:background 0.2s}
    .hist-row:last-child{border-bottom:none}
    .hist-row:hover{background:rgba(255,255,255,0.03)}
    .hist-row.new{border-left:3px solid var(--green)}
    .hist-row.sent{border-left:3px solid var(--red)}
    .hist-user{font-size:14px;font-weight:600;color:rgba(255,255,255,0.8)}
    .hist-by{font-size:11px;color:var(--text3);margin-left:6px}
    .hist-tag{font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:0.5px}
    .tag-new{background:rgba(0,200,83,0.1);color:#69F0AE}
    .tag-sent{background:rgba(255,23,68,0.08);color:#FF5252}

    .logo-box{text-align:center;margin-bottom:24px}
    .logo-c{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:inline-flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 28px rgba(108,99,255,0.3)}
    .logo-t{font-size:22px;font-weight:800;color:var(--text);margin-top:12px;margin-bottom:2px;letter-spacing:-0.5px}
    .logo-s{font-size:13px;color:var(--text3)}

    .block-msg{font-size:12px;color:#FFD600;text-align:center;padding:10px;background:rgba(255,214,0,0.05);border:1px solid rgba(255,214,0,0.1);border-radius:10px;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">

    <div id="page-login">
      <div class="logo-box">
        <div class="logo-c">✉️</div>
        <div class="logo-t">Dudes Team DM Check</div>
        <div class="logo-s">Team access only</div>
      </div>
      <div class="section">
        <div class="label">Access Key</div>
        <div class="input-row">
          <input type="password" id="login-key" placeholder="Paste your key" autocomplete="off">
        </div>
        <div class="err" id="login-error"></div>
        <div class="block-msg hidden" id="login-block">Locked. Wait <span id="login-block-time">5:00</span></div>
        <div style="margin-top:14px"><button class="b b-p" style="width:100%;padding:14px" id="login-btn" onclick="doLogin()">Login</button></div>
      </div>
    </div>

    <div id="page-dash" class="hidden">
      <div class="section">
        <div class="head">
          <div class="greet">Hey, <span id="dash-name"></span></div>
          <button class="logout" onclick="doLogout()">Logout</button>
        </div>
      </div>

      <div class="section">
        <div class="label">Check a username</div>
        <div class="input-row">
          <input type="text" id="dash-user" placeholder="@username" autocomplete="off">
          <button class="go" id="dash-btn" onclick="doCheck()">Check</button>
        </div>
      </div>

      <div class="status status-ok hidden" id="box-safe">
        <div class="s-icon">✅</div>
        <div class="s-title">Not yet contacted</div>
        <div class="s-sub">Safe to send a message</div>
        <div class="btns">
          <button class="b b-g" id="box-confirm" onclick="doConfirm()">Confirm</button>
        </div>
      </div>

      <div class="status status-no hidden" id="box-no">
        <div class="s-icon">⛔</div>
        <div class="s-title">Already messaged</div>
        <div class="s-sub">Someone from the team already reached out</div>
        <div class="s-info">
          <div class="s-info-row">Sent by: <strong id="box-by"></strong></div>
          <div class="s-info-row" id="box-time"></div>
        </div>
        <div class="btns">
          <button class="b b-o" onclick="doReset()">Check Another</button>
        </div>
      </div>

      <div class="status status-sv hidden" id="box-saved">
        <div class="s-icon">✅</div>
        <div class="s-title">Marked as contacted</div>
        <div class="s-sub">You can now message this person</div>
        <div class="btns">
          <a class="b b-p" id="box-profile" href="#" target="_blank" rel="noopener">Open Profile</a>
          <button class="b b-o" onclick="doReset()">Check Another</button>
        </div>
      </div>

      <div class="section" id="dash-hist-wrap">
        <div class="hist-head">
          <span class="hist-label">Recent</span>
          <button class="hist-clear" onclick="clearHist()">Clear</button>
        </div>
        <div class="hist-list" id="dash-hist"></div>
      </div>
    </div>
  </div>

  <script>
    var API='https://script.google.com/macros/s/AKfycbzpU5v5TLO9ZZsKpVhF2AaXBYlBxtiOlJV6uiGVD9dPog2a-WBYXvi7UM79xrN9Cnu2/exec';
    var curUser='',fails=0,blockUntil=0;

    function fmtTime(){
      var now=new Date();
      var utc=now.getTime()+now.getTimezoneOffset()*60000;
      var bd=new Date(utc+3600000*6);
      var h=bd.getHours(),ap=h>=12?'PM':'AM',h12=h%12||12;
      var mi=String(bd.getMinutes()).padStart(2,'0');
      var se=String(bd.getSeconds()).padStart(2,'0');
      var dd=String(bd.getDate()).padStart(2,'0');
      var mm=String(bd.getMonth()+1).padStart(2,'0');
      var yy=bd.getFullYear();
      var mths=['','January','February','March','April','May','June','July','August','September','October','November','December'];
      return String(h12).padStart(2,'0')+':'+mi+':'+se+' '+ap+', '+dd+' '+mths[parseInt(mm)]+' '+yy;
    }

    async function asyncFetch(url, opts, retries) {
      retries = retries || 3;
      for (var i = 0; i < retries; i++) {
        try {
          var r = await fetch(url, opts);
          return r;
        } catch(e) {
          if (i === retries - 1) throw e;
          await new Promise(function(res) { setTimeout(res, 1000) });
        }
      }
    }

    function show(id){document.getElementById('page-login').classList.add('hidden');document.getElementById('page-dash').classList.add('hidden');document.getElementById(id).classList.remove('hidden')}
    function hideBoxes(){['box-safe','box-no','box-saved'].forEach(function(id){document.getElementById(id).classList.add('hidden')})}

    async function doLogin(){
      var k=document.getElementById('login-key').value.trim();
      var e=document.getElementById('login-error');e.textContent='';
      if(document.getElementById('login-block').classList.contains('hidden')===false)return;
      if(!k){e.textContent='Enter your key';return}
      document.getElementById('login-btn').disabled=true;
      document.getElementById('login-btn').innerHTML='<span class="spin"></span>Logging in...';
      try{
        var r=await asyncFetch(API+'?type=login&key='+encodeURIComponent(k),{mode:'cors',signal:AbortSignal.timeout(10000)});
        var d=await r.json();
        document.getElementById('login-btn').disabled=false;document.getElementById('login-btn').textContent='Login';
        if(d.valid){localStorage.setItem('dm_key',k);localStorage.setItem('dm_name',d.name);localStorage.setItem('dm_time',Date.now().toString());fails=0;localStorage.removeItem('dm_fails');localStorage.removeItem('dm_block');goDash();}
        else{fails++;localStorage.setItem('dm_fails',fails.toString());if(fails>=3){blockUntil=Date.now()+300000;localStorage.setItem('dm_block',blockUntil.toString());startBlock();}else{e.textContent='Wrong key. '+(3-fails)+' tries left.';}}
      }catch(ex){document.getElementById('login-btn').disabled=false;document.getElementById('login-btn').textContent='Login';e.textContent='Network error! Please try again.';}
    }
    function startBlock(){
      var b=document.getElementById('login-block'),t=document.getElementById('login-block-time');b.classList.remove('hidden');document.getElementById('login-btn').disabled=true;
      var iv=setInterval(function(){var l=blockUntil-Date.now();if(l<=0){clearInterval(iv);b.classList.add('hidden');document.getElementById('login-btn').disabled=false;fails=0;localStorage.removeItem('dm_fails');localStorage.removeItem('dm_block');return}t.textContent=Math.floor(l/60000)+':'+String(Math.floor((l%60000)/1000)).padStart(2,'0');},1000);
    }
    function goDash(){document.getElementById('dash-name').textContent=localStorage.getItem('dm_name');show('page-dash');renderHist()}
    function doLogout(){localStorage.removeItem('dm_key');localStorage.removeItem('dm_name');localStorage.removeItem('dm_time');show('page-login');document.getElementById('login-key').value='';document.getElementById('login-error').textContent='';hideBoxes()}

    async function doCheck(){
      var u=document.getElementById('dash-user').value.trim(),btn=document.getElementById('dash-btn');
      if(!u)return;if(!u.startsWith('@'))u='@'+u;
      hideBoxes();btn.disabled=true;btn.innerHTML='<span class="spin"></span>Checking...';
      try{
        var r=await asyncFetch(API+'?type=username&value='+encodeURIComponent(u),{mode:'cors',signal:AbortSignal.timeout(10000)});
        var d=await r.json();btn.disabled=false;btn.textContent='Check';
        if(d.exists){document.getElementById('box-by').textContent=d.teamName||'Unknown';document.getElementById('box-time').textContent=d.timestamp||'';document.getElementById('box-no').classList.remove('hidden');addHist(u,false,d.teamName);}
        else{curUser=u;document.getElementById('box-safe').classList.remove('hidden');addHist(u,true,null);}
      }catch(e){btn.disabled=false;btn.textContent='Check';alert('Network error! Please try again.');}
    }

    async function doConfirm(){
      var b=document.getElementById('box-confirm');b.disabled=true;b.innerHTML='<span class="spin"></span>Saving...';
      var nm=localStorage.getItem('dm_name'),ts=fmtTime();
      try{await asyncFetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:curUser,profileLink:'https://x.com/'+curUser.replace('@',''),timestamp:ts,teamName:nm})})}catch(e){alert('Save failed! Check connection.');}
      document.getElementById('box-safe').classList.add('hidden');document.getElementById('box-profile').href='https://x.com/'+curUser.replace('@','');document.getElementById('box-saved').classList.remove('hidden');updateHist(curUser,nm);b.disabled=false;b.textContent='Confirm';
    }

    function doReset(){hideBoxes();document.getElementById('dash-user').value='';document.getElementById('dash-user').focus()}

    function getH(){try{return JSON.parse(localStorage.getItem('dm_h')||'[]')}catch(e){return[]}}
    function addHist(u,safe,by){var h=getH();h.unshift({u:u,s:safe,b:by||localStorage.getItem('dm_name'),t:fmtTime()});if(h.length>30)h=h.slice(0,30);localStorage.setItem('dm_h',JSON.stringify(h));renderHist();}
    function updateHist(u,by){var h=getH();for(var i=0;i<h.length;i++){if(h[i].u===u&&h[i].s===true){h[i].b=by;h[i].t=fmtTime();break}}localStorage.setItem('dm_h',JSON.stringify(h));renderHist();}
    function clearHist(){localStorage.removeItem('dm_h');renderHist();}
    function renderHist(){
      var h=getH(),el=document.getElementById('dash-hist'),wrap=document.getElementById('dash-hist-wrap');
      if(!h.length){wrap.style.display='none';return}wrap.style.display='block';
      var s='';for(var i=0;i<h.length;i++){s+='<div class="hist-row '+(h[i].s?'new':'sent')+'"><div><span class="hist-user">'+h[i].u+'</span><span class="hist-by">by '+h[i].b+'</span></div><span class="hist-tag '+(h[i].s?'tag-new':'tag-sent')+'">'+(h[i].s?'NEW':'SENT')+'</span></div>';}
      el.innerHTML=s;
    }

    (function(){var k=localStorage.getItem('dm_key'),n=localStorage.getItem('dm_name'),t=localStorage.getItem('dm_time');var sf=localStorage.getItem('dm_fails'),sb=localStorage.getItem('dm_block');if(sf)fails=parseInt(sf);if(sb&&Date.now()<parseInt(sb)){blockUntil=parseInt(sb);startBlock()}if(k&&n&&t){if(Date.now()-parseInt(t)>3600000)doLogout();else goDash()}})();
    document.getElementById('login-key').addEventListener('keypress',function(e){if(e.key==='Enter')doLogin()});
    document.getElementById('dash-user').addEventListener('keypress',function(e){if(e.key==='Enter')doCheck()});
  </script>
</body>
</html>
